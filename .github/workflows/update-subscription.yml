name: Update NORDLYNX public test subscription

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/update-subscription.yml'
      - 'README_RU.md'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Install sing-box
        run: |
          curl -fsSL https://sing-box.app/install.sh | sudo sh
          sing-box version

      - name: Build and end-to-end test subscription
        run: python src/build_subscription.py
        env:
          MIN_NODES: '20'
          MIN_COUNTRIES: '20'
          MAX_PER_COUNTRY: '3'
          PROBE_TIMEOUT: '12'

      - name: Prepare Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
